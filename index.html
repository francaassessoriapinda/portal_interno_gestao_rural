<style>
:root{--azul:#1C3B67;--azul-2:#12284A;--azul-3:#2B5590;--laranja:#E85B4A;--laranja-2:#C9473A;--papel:#F3F6FA;--tinta:#1B2433;--suave:#5B6B82;--linha:#DCE3ED;--verde:#2F7D5B;--verde-bg:#E5F2EA;--amarelo:#8A5E00;--amarelo-bg:#FFF3D2;--vermelho:#B23A2E;--vermelho-bg:#FCE8E5;--raio:10px}
*{box-sizing:border-box}
body{margin:0;font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--papel);color:var(--tinta);font-size:14.5px;line-height:1.55}
a{color:var(--azul-3)}
.topo{background:linear-gradient(115deg,var(--azul-2),var(--azul) 55%,var(--azul-3));color:#fff;padding:18px 24px 0}
.topo-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-bottom:16px}
.marca{display:flex;align-items:center;gap:16px}
.marca img{height:44px;width:auto;display:block}
.marca small{display:block;font-size:13px;color:#C9D5E6;border-left:1px solid rgba(255,255,255,.28);padding-left:16px;line-height:1.3;max-width:180px}
.login .marca{flex-direction:column;align-items:flex-start;gap:6px}
.login .marca img{height:56px}
.login .marca small{color:var(--suave);border:0;padding:0;max-width:none}
.rel-cab img{height:34px;width:auto;display:block;margin-bottom:4px}
.quem{margin-left:auto;font-size:13px;color:#C9D5E6;display:flex;gap:12px;align-items:center}
.quem button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:7px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
nav.abas{max-width:1320px;margin:0 auto;display:flex;gap:2px;overflow-x:auto}
nav.abas button{background:none;border:0;color:#C9D5E6;font:inherit;font-size:14px;padding:10px 15px;border-radius:9px 9px 0 0;cursor:pointer;white-space:nowrap}
nav.abas button[aria-current="page"]{background:var(--papel);color:var(--azul);font-weight:600}
main{max-width:1320px;margin:0 auto;padding:26px 24px 60px}
h1{font-size:23px;margin:0 0 4px;color:var(--azul);font-weight:600}
h2{font-size:17px;margin:30px 0 10px;color:var(--azul);font-weight:600}
h3{font-size:15px;margin:20px 0 6px;font-weight:600}
p{margin:0 0 10px}
.sub{color:var(--suave);margin:0 0 22px;max-width:76ch}
.bloco{background:#fff;border:1px solid var(--linha);border-radius:var(--raio);padding:20px}
.form{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.form .campo{flex:1 1 170px}
.form .largo{flex-basis:100%}
.campo{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--suave)}
.campo input,.campo select,.campo textarea{font:inherit;font-size:14px;color:var(--tinta);padding:9px 11px;border:1px solid #C6D1DF;border-radius:8px;background:#fff;width:100%}
.campo textarea{min-height:90px;resize:vertical}
.marcar{display:flex;gap:8px;align-items:center;font-size:14px}
:focus-visible{outline:3px solid #F2A69C;outline-offset:2px}
.btn{font:inherit;font-size:14px;font-weight:500;border:0;border-radius:8px;padding:10px 18px;background:var(--laranja);color:#fff;cursor:pointer;white-space:nowrap}
a.btn{text-decoration:none;display:inline-block}
.btn:hover{background:var(--laranja-2)}
.btn.sec{background:#fff;color:var(--azul);border:1px solid #BFCBDB}
.btn.sec:hover{background:#EEF3F9}
.btn.peq{padding:5px 10px;font-size:12.5px}
.btn.perigo{background:#fff;color:var(--vermelho);border:1px solid #E7B6AF}
.btn:disabled{opacity:.55;cursor:progress}
.acoes{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.tabela{width:100%;overflow-x:auto;border:1px solid var(--linha);border-radius:var(--raio);background:#fff}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--suave);font-size:12.5px;padding:10px 12px;border-bottom:1px solid var(--linha);background:#F7F9FC;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid #EDF1F6;vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tr.cancelado td{color:#9AA6B6;text-decoration:line-through}
tr.destaque td{background:#FFF6E0}tr.destaque td:first-child{box-shadow:inset 4px 0 0 var(--laranja)}
.v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ent{color:var(--verde)}.sai{color:var(--vermelho)}
tfoot td{font-weight:600;background:#F7F9FC;border-top:2px solid var(--linha)}
.chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap}
.ok{background:var(--verde-bg);color:var(--verde)}.rev{background:var(--amarelo-bg);color:var(--amarelo)}.err{background:var(--vermelho-bg);color:var(--vermelho)}.neu{background:#E9EEF5;color:var(--suave)}
.vazio{padding:34px 20px;text-align:center;color:var(--suave)}
.pequeno{font-size:12.5px;color:var(--suave)}
/* Aviso do gestor: a peça de destaque do painel */
.mural{border-radius:14px;padding:22px 26px;color:#fff;background:var(--azul-3);display:grid;grid-template-columns:1fr auto;gap:8px 24px;align-items:start;margin-bottom:26px}
.mural.atencao{background:#A06C00}
.mural.urgente{background:linear-gradient(115deg,#B9382B,var(--laranja))}
.mural h2{color:#fff;margin:0;font-size:21px;line-height:1.3;max-width:60ch}
.mural p{margin:6px 0 0;max-width:90ch;color:rgba(255,255,255,.93)}
.mural .meta{font-size:12.5px;color:rgba(255,255,255,.8);margin-top:10px}
.mural .meta a{color:#fff}
.mural .btn{background:#fff;color:var(--azul)}
.mural .grau{font-size:12.5px;font-weight:600;background:rgba(255,255,255,.18);padding:3px 10px;border-radius:20px;justify-self:start}
.numeros{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:8px}
.numeros div{background:#fff;border:1px solid var(--linha);border-radius:var(--raio);padding:16px 18px}
.numeros b{display:block;font-size:28px;font-weight:600;color:var(--azul);font-variant-numeric:tabular-nums;line-height:1.2}
.numeros span{font-size:13px;color:var(--suave)}
.numeros .alerta b{color:var(--laranja)}
.barra{height:8px;background:#E6ECF4;border-radius:5px;overflow:hidden;min-width:120px}
.barra i{display:block;height:100%;background:var(--azul-3)}
.barra.al i{background:#D9A21B}.barra.ob i{background:var(--laranja)}
.custo{display:grid;grid-template-columns:minmax(240px,1fr) 2fr;gap:22px;align-items:start}
.custo .gasto b{display:block;font-size:30px;font-weight:600;color:var(--azul);font-variant-numeric:tabular-nums;line-height:1.2}
.custo .gasto span{font-size:13px;color:var(--suave)}
.metodos{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.metodos div{border:1px solid var(--linha);border-radius:8px;padding:10px 12px}
.metodos b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.metodos small{display:block;color:var(--suave);font-size:12px;line-height:1.35}
.metodos .gratis b{color:var(--verde)}
@media (max-width:700px){.custo{grid-template-columns:1fr}}
.fecho{display:flex;flex-wrap:wrap;gap:28px 48px;align-items:flex-end;margin:6px 0 22px}
.fecho div{display:flex;flex-direction:column}
.fecho span{font-size:13px;color:var(--suave)}
.fecho b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.fecho .resultado b{font-size:32px;color:var(--azul);border-bottom:4px double var(--azul);padding-bottom:2px;line-height:1.2}
.drop{border:2px dashed #AFC0D6;border-radius:var(--raio);background:#fff;padding:24px 20px;text-align:center;cursor:pointer}
.drop.sobre{background:#EEF3FA;border-color:var(--azul-3)}
.lista-msg{margin:8px 0;padding-left:20px}
.lista-msg li{margin-bottom:4px}
.caixa-erro{background:var(--vermelho-bg);border-radius:var(--raio);padding:14px 18px;margin:12px 0}
.caixa-aviso{background:var(--amarelo-bg);border-radius:var(--raio);padding:14px 18px;margin:12px 0}

}

const ST={getItem:k=>{ try{ return sessionStorage.getItem(k)||localStorage.getItem(k); }catch(e){ return null; } },
  setItem:(k,v)=>{ try{ sessionStorage.setItem(k,v); }catch(e){} try{ localStorage.setItem(k,v); }catch(e){} },
  removeItem:k=>{ try{ sessionStorage.removeItem(k); }catch(e){} try{ localStorage.removeItem(k); }catch(e){} }};
let TOKEN = ST.getItem('lcr_ges_token') || '';

async function api(acao, dados){
  if (!API_URL || API_URL.indexOf('COLE_') === 0) throw new Error('Configure a URL do servidor (API_URL) no início deste arquivo.');
  const r = await fetch(API_URL, {method:'POST', body: JSON.stringify({acao, token: TOKEN, dados})});
  const j = await r.json();
  if (!j.ok){ if (j.codigo === 'SESSAO'){ sair(); } throw new Error(j.erro || 'Erro no servidor.'); }
  return j.dados;
}

function blocoUso(u){
  if (!u) return '';
  const m=u.mes, real=v=>brl(v*u.cotacao), pc=u.orcamentoUSD>0?m.usd/u.orcamentoUSD*100:0, cl=pc>=100?'ob':pc>=80?'al':'';
  const gratis=m.metodos.XML+m.metodos.OCR, tot=m.leituras||0;
  const comp=c=>c.slice(5)+'/'+c.slice(0,4);
  const alertas=[];
  if(!u.ocrAtivo) alertas.push('OCR do Drive desligado: no Apps Script, em Serviços, adicione “Drive API”.');
  if(!u.iaConfigurada) alertas.push('Leitura por IA sem chave: o que o XML e o OCR não resolverem vai para “Revisar”.');
  if(pc>=100) alertas.push('Orçamento do mês atingido: a IA está pausada até o próximo mês ou até você aumentar o limite em Configurações.');
  return `<h2>Leitura automática — custo em ${comp(u.competencia)}</h2>
  <div class="bloco custo">
    <div class="gasto"><span>Gasto no mês</span><b>${real(m.usd)}</b><span>US$ ${m.usd.toFixed(2)} de US$ ${u.orcamentoUSD.toFixed(2)} de orçamento</span>
      <div class="barra ${cl}" style="margin:10px 0 4px"><i style="width:${Math.min(pc,100).toFixed(1)}%"></i></div>
      <span>Mês anterior: ${real(u.mesAnterior.usd)} · No ano: ${real(u.ano.usd)}<br>Cotação usada: R$ ${u.cotacao.toFixed(2).replace('.',',')} · modelo ${esc(u.modelo)}</span></div>
    <div><p class="pequeno" style="margin-bottom:8px">${tot?`${Math.round(gratis/tot*100)}% das ${tot} leituras do mês saíram sem custo.`:'Nenhuma leitura neste mês ainda.'}</p>
      <div class="metodos">
        <div class="gratis"><b>${m.metodos.XML}</b><small>XML da NF-e<br>sem custo</small></div>
        <div class="gratis"><b>${m.metodos.OCR}</b><small>OCR do Drive<br>sem custo</small></div>
        <div><b>${m.metodos['IA-texto']}</b><small>IA lendo o texto<br>frações de centavo</small></div>
        <div><b>${m.metodos['IA-arquivo']}</b><small>IA lendo a imagem/PDF<br>etapa mais cara</small></div>
      </div>
      ${alertas.length?`<div class="caixa-aviso" style="margin-bottom:0"><ul class="lista-msg" style="margin:0">${alertas.map(a=>`<li>${esc(a)}</li>`).join('')}</ul></div>`:''}
    </div>
  </div>`;
}

      <td><span class="chip ${s[0]}">${s[1]}</span></td><td class="pequeno" style="max-width:420px">${msgs.map(esc).join('<br>')}</td>

          :`<button class="btn peq" data-lman="${d.id}" title="Criar o lançamento a partir deste documento">Lançar manualmente</button>
            <button class="btn sec peq" data-vinc="${d.id}" title="Ligar a um lançamento que já existe">Vincular a lançamento</button>`}

function ligarDocs(){
  document.querySelectorAll('[data-vdoc]').forEach(b=>b.onclick=()=>verDocumento(b.dataset.vdoc, b.dataset.vnome||'', b.dataset.vurl));
  document.querySelectorAll('[data-mcli]').forEach(b=>b.onclick=()=>{ const d=(G.docsVistos||[]).find(x=>x.id===b.dataset.mcli); if(d) trocarClienteDlg({documentoId:d.id, de:d.clienteId, desc:d.nomeArquivo}); });
  document.querySelectorAll('[data-imp1]').forEach(b=>b.onclick=()=>imprimirDocumentos([{id:b.dataset.imp1}], b));
  document.querySelectorAll('[data-gxml]').forEach(b=>b.onclick=()=>gerarXml(b.dataset.gxml, b));
  document.querySelectorAll('[data-ver]').forEach(b=>b.onclick=()=>{ const [c,ids]=b.dataset.ver.split('|'); G.cli=c; G.lCli=c; G.lSit=''; G.destacar=ids.split(','); G.periodo={ini:'2000-01-01',fim:'2099-12-31'}; abrir('lanc'); });
  document.querySelectorAll('[data-lman]').forEach(b=>b.onclick=()=>{ const d=(G.docsVistos||[]).find(x=>x.id===b.dataset.lman); if(!d) return;
    G.cli=d.clienteId; editarLanc({documentoId:d.id, docUrl:d.driveUrl, codImovel:d.codImovel, codConta:d.codConta, tipoLanc:'2', historico:'', origemDoc:d.nomeArquivo}); });
  document.querySelectorAll('[data-vinc]').forEach(b=>b.onclick=()=>{ const d=(G.docsVistos||[]).find(x=>x.id===b.dataset.vinc); if(d) vincularDoc(d); });
  document.querySelectorAll('[data-reler]').forEach(b=>b.onclick=()=>acao(b, async()=>{ const r=await api('ges.documento.reprocessar',{id:b.dataset.reler}); toast(r.lancamentos.length+' lançamento(s) criado(s).'); abrir(G.aba); }));
  document.querySelectorAll('[data-desc]').forEach(b=>b.onclick=()=>{
    const motivo = prompt('Motivo do descarte (o arquivo continua guardado no Drive e os lançamentos dele serão cancelados):');
    if (motivo) acao(b, async()=>{ await api('ges.documento.descartar',{id:b.dataset.desc, motivo}); toast('Documento descartado.'); abrir(G.aba); });
  });
}

const ARQ_CACHE = new Map();
async function baixarArquivos(ids, progresso){
  const falta = ids.filter(id=>!ARQ_CACHE.has(id)), out=[];
  for(let i=0;i<falta.length;i+=6){
    const r = await api('ges.documento.arquivos',{ids:falta.slice(i,i+6)});
    r.forEach(a=>{ if(!a.erro){ if(ARQ_CACHE.size>40) ARQ_CACHE.delete(ARQ_CACHE.keys().next().value); ARQ_CACHE.set(a.id,a); } else out.push(a); });
    if(progresso) progresso(Math.min(i+6,falta.length), falta.length);
  }
  return ids.map(id=>ARQ_CACHE.get(id) || out.find(a=>a.id===id) || {id, erro:'Arquivo não encontrado.'});
}
const b64Bytes = b => { const s=atob(b), u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; };
const tipoArq = a => /pdf/i.test(a.mime)||/\.pdf$/i.test(a.nome) ? 'pdf' : /^image/i.test(a.mime)||/\.(jpe?g|png|webp|gif)$/i.test(a.nome) ? 'img' : /xml/i.test(a.mime)||/\.xml$/i.test(a.nome) ? 'xml' : 'outro';
function carregarScript(src, glob){ return new Promise((ok,er)=>{ if(glob()) return ok(glob()); const s=document.createElement('script'); s.src=src; s.onload=()=>ok(glob()); s.onerror=()=>er(new Error('Sem internet para carregar o visualizador.')); document.head.appendChild(s); }); }

// Resumo legível de um XML de nota (NF-e, NFS-e, CT-e)
function resumoXml(txt){
  let x; try{ x=new DOMParser().parseFromString(txt,'application/xml'); }catch(e){ return null; }
  if(x.getElementsByTagName('parsererror').length) return null;
  const q=(n,raiz)=>{ const e=(raiz||x).getElementsByTagNameNS('*',n)[0]||(raiz||x).getElementsByTagName(n)[0]; return e?e.textContent.trim():''; };
  const el=n=>x.getElementsByTagNameNS('*',n)[0]||x.getElementsByTagName(n)[0];
  const emit=el('emit')||el('prest')||el('Prestador')||el('PrestadorServico'), dest=el('dest')||el('toma')||el('Tomador')||el('TomadorServico');
  const doc=n=>n?(q('CNPJ',n)||q('CPF',n)||q('Cnpj',n)||q('Cpf',n)):'';
  const nome=n=>n?(q('xNome',n)||q('RazaoSocial',n)):'';
  const r={ tipo: el('infNFe')?'NF-e':el('infCte')?'CT-e':'NFS-e', numero:q('nNF')||q('nCT')||q('nNFSe')||q('Numero'), emissao:(q('dhEmi')||q('dEmi')||q('dhProc')||q('DataEmissao')).slice(0,10),
    emitente:nome(emit), emitenteDoc:doc(emit), destinatario:nome(dest), destinatarioDoc:doc(dest),
    valor:q('vNF')||q('vTPrest')||q('vServ')||q('vLiq')||q('ValorServicos'), natureza:q('natOp')||q('xDescServ')||q('Discriminacao'),
    chave:((el('infNFe')||el('infCte')||el('infNFSe')||{getAttribute:()=>''}).getAttribute('Id')||q('chNFe')||'').replace(/\D/g,''), itens:[] };
  [...x.getElementsByTagNameNS('*','det')].slice(0,60).forEach(d=>r.itens.push({desc:q('xProd',d), qtd:q('qCom',d), un:q('uCom',d), valor:q('vProd',d), ncm:q('NCM',d)}));
  return r;
}
const brlTxt = v => v?brl(Number(v)):'';
function htmlResumoXml(r, txt){
  if(!r) return `<pre class="xml-cru">${esc(txt)}</pre>`;
  return `<div class="xml-nota"><h4>${esc(r.tipo)} ${esc(r.numero)}</h4>
    <dl><dt>Emissão</dt><dd>${dataBR(r.emissao)}</dd><dt>Valor total</dt><dd><b>${brlTxt(r.valor)}</b></dd>
    <dt>Emitente</dt><dd>${esc(r.emitente)}<br>${cpfFmt(r.emitenteDoc)}</dd><dt>Destinatário</dt><dd>${esc(r.destinatario)}<br>${cpfFmt(r.destinatarioDoc)}</dd>
    ${r.natureza?`<dt>Natureza / serviço</dt><dd>${esc(r.natureza.slice(0,400))}</dd>`:''}${r.chave?`<dt>Chave</dt><dd style="font-variant-numeric:tabular-nums;word-break:break-all">${r.chave.replace(/(\d{4})/g,'$1 ')}</dd>`:''}</dl>
    ${r.itens.length?`<table><thead><tr><th>Produto</th><th>NCM</th><th class="v">Qtd</th><th class="v">Valor</th></tr></thead><tbody>${r.itens.map(i=>`<tr><td>${esc(i.desc)}</td><td>${esc(i.ncm)}</td><td class="v">${esc(i.qtd)} ${esc(i.un)}</td><td class="v">${brlTxt(i.valor)}</td></tr>`).join('')}</tbody></table>`:''}
    <details><summary>Ver XML original</summary><pre class="xml-cru">${esc(txt)}</pre></details></div>`;
}

        if(meu===tk && textos[i].items.length && lib.renderTextLayer){ try{ await lib.renderTextLayer({textContentSource:textos[i], container:cam, viewport:vp, textDivs:[]}).promise; }catch(e){} } }); };
    zoom=larguraUtil()/pags[0].getViewport({scale:1}).width;
  } else if(t==='xml'){
    const txt=new TextDecoder('utf-8').decode(b64Bytes(a.base64));
    area.innerHTML=`<div class="visor-texto">${htmlResumoXml(resumoXml(txt), txt)}</div>`;
    const bx=area.firstChild; render=()=>{ bx.style.fontSize=(14*zoom)+'px'; };
    caixa.querySelector('[data-z="gira"]').hidden=true; caixa.querySelector('[data-z="sel"]').hidden=true; temTexto=true;
  } else { area.innerHTML=`<div class="vazio">Este tipo de arquivo não tem pré-visualização. Use “Abrir no Drive”.</div>`; return; }
  const atual=()=>{ pc.textContent=Math.round(zoom*100)+'%'; render(); };
  const mudar=(z,cx,cy)=>{ z=Math.min(6,Math.max(.15,z)); const fx=(area.scrollLeft+(cx??area.clientWidth/2))/area.scrollWidth, fy=(area.scrollTop+(cy??area.clientHeight/2))/area.scrollHeight;
    zoom=z; atual(); area.scrollLeft=fx*area.scrollWidth-(cx??area.clientWidth/2); area.scrollTop=fy*area.scrollHeight-(cy??area.clientHeight/2); };
  caixa.querySelectorAll('[data-z]').forEach(b=>b.onclick=async()=>{ const k=b.dataset.z;
    if(k==='sel'){ modoSel(!area.classList.contains('selecionar')); return; }
    if(k==='voltar'){ painelTxt.hidden=true; area.hidden=false; return; }
    if(k==='copiar'){ try{ await navigator.clipboard.writeText(caixa.querySelector('.visor-pre').textContent); toast('Texto copiado.'); }catch(e){ toast('Selecione o texto e use Ctrl+C.',true); } return; }
    if(k==='ocr'){ const pre=caixa.querySelector('.visor-pre'); area.hidden=true; painelTxt.hidden=false;
      if(!pre.dataset.ok){ pre.textContent='Lendo o texto do documento…';
        try{ const r=await api('ges.documento.texto',{id:docId}); pre.textContent=(r.texto||'').trim()||'Nenhum texto legível foi encontrado neste documento.'; pre.dataset.ok='1'; }
        catch(e){ pre.textContent=e.message; } }
      return; }
    if(k==='+') mudar(zoom*1.25); else if(k==='-') mudar(zoom/1.25); else if(k==='100') mudar(1);
    else if(k==='gira'){ giro=(giro+90)%360; atual(); caixa.querySelector('[data-z="larg"]').click(); }
    else if(k==='larg'){ if(t==='img'){ const w=giro%180?area.querySelector('img').naturalHeight:area.querySelector('img').naturalWidth; mudar(larguraUtil()/w); } else if(t==='pdf'){ mudar(zoom*larguraUtil()/area.querySelector('canvas').clientWidth); } else mudar(1); } });
  area.addEventListener('wheel',e=>{ if(!e.ctrlKey&&!e.metaKey) return; e.preventDefault(); const r=area.getBoundingClientRect(); mudar(zoom*(e.deltaY<0?1.12:1/1.12), e.clientX-r.left, e.clientY-r.top); },{passive:false});
  area.addEventListener('keydown',e=>{ if(e.key==='+'||e.key==='='){ e.preventDefault(); mudar(zoom*1.25); } if(e.key==='-'){ e.preventDefault(); mudar(zoom/1.25); } });
  let arr=null; area.addEventListener('pointerdown',e=>{ if(e.button!==0||t==='xml'||area.classList.contains('selecionar')) return; arr={x:e.clientX,y:e.clientY,l:area.scrollLeft,t:area.scrollTop}; area.setPointerCapture(e.pointerId); area.classList.add('arrastando'); });
  area.addEventListener('pointermove',e=>{ if(!arr) return; area.scrollLeft=arr.l-(e.clientX-arr.x); area.scrollTop=arr.t-(e.clientY-arr.y); });
  const solta=()=>{ arr=null; area.classList.remove('arrastando'); }; area.addEventListener('pointerup',solta); area.addEventListener('pointercancel',solta);
  atual();
  // PDF com texto já abre no modo de seleção; foto e PDF escaneado abrem para arrastar (use “Texto do documento” para copiar)
  modoSel(t==='pdf' && temTexto);
}

// Impressão: junta os arquivos escolhidos num único PDF (PDF, fotos e resumo dos XML) e abre para imprimir
async function imprimirDocumentos(docs, btn){
  if(!docs.length){ toast('Selecione ao menos um documento.',true); return; }
  const txtOrig=btn?btn.textContent:''; if(btn) btn.disabled=true;
  try{
    const L=await pdflib(), saida=await L.PDFDocument.create(), fonte=await saida.embedFont(L.StandardFonts.Helvetica), negr=await saida.embedFont(L.StandardFonts.HelveticaBold);
    const arqs=await baixarArquivos(docs.map(d=>d.id), (f,t)=>{ if(btn) btn.textContent='Baixando '+f+' de '+t+'…'; });
    const falhas=[]; if(btn) btn.textContent='Montando o PDF…';
    const limpo=t=>String(t||'').normalize('NFC').replace(/[^\x20-\x7E\xA0-\xFF]/g,' ');
    for(const a of arqs){
      if(a.erro){ falhas.push(a.nome+': '+a.erro); continue; }
      const t=tipoArq(a), bytes=b64Bytes(a.base64);
      try{
        if(t==='pdf'){ const src=await L.PDFDocument.load(bytes,{ignoreEncryption:true}); (await saida.copyPages(src, src.getPageIndices())).forEach(p=>saida.addPage(p)); }
        else if(t==='img'){
          let img; if(/png/i.test(a.mime)) img=await saida.embedPng(bytes); else if(/jpe?g/i.test(a.mime)) img=await saida.embedJpg(bytes);
          else { const bm=await createImageBitmap(new Blob([bytes],{type:a.mime})); const c=document.createElement('canvas'); c.width=bm.width; c.height=bm.height; c.getContext('2d').drawImage(bm,0,0); img=await saida.embedJpg(b64Bytes((c.toDataURL('image/jpeg',.9)).split(',')[1])); }
          const pais=img.width>img.height, W=pais?842:595, H=pais?595:842, k=Math.min((W-36)/img.width,(H-36)/img.height), pg=saida.addPage([W,H]);
          pg.drawImage(img,{x:(W-img.width*k)/2, y:(H-img.height*k)/2, width:img.width*k, height:img.height*k});
        } else if(t==='xml'){
          const txt=new TextDecoder('utf-8').decode(bytes), r=resumoXml(txt); let pg=saida.addPage([595,842]), y=800;
          const linha=(s,f,tam)=>{ f=f||fonte; tam=tam||10; const pal=limpo(s).split(' '); let at='';
            const sai=t=>{ if(y<50){ pg=saida.addPage([595,842]); y=800; } pg.drawText(t,{x:40,y,size:tam,font:f}); y-=tam+5; };
            pal.forEach(w=>{ const tt=at?at+' '+w:w; if(f.widthOfTextAtSize(tt,tam)>515){ sai(at); at=w; } else at=tt; }); if(at) sai(at); };
          linha('Arquivo: '+a.nome+(a.cliente?'  ·  Cliente: '+a.cliente:''),fonte,8); y-=6;
          if(r){ linha(r.tipo+' nº '+r.numero,negr,15); y-=4;
            linha('Emissão: '+dataBR(r.emissao)+'     Valor total: '+brlTxt(r.valor),negr,11);
            linha('Emitente: '+r.emitente+' — '+cpfFmt(r.emitenteDoc)); linha('Destinatário: '+r.destinatario+' — '+cpfFmt(r.destinatarioDoc));
            if(r.natureza) linha('Natureza / serviço: '+r.natureza.slice(0,600)); if(r.chave) linha('Chave de acesso: '+r.chave.replace(/(\d{4})/g,'$1 '));
            if(r.itens.length){ y-=6; linha('Produtos',negr,11); r.itens.forEach(i=>linha('• '+i.desc+'  ·  NCM '+i.ncm+'  ·  '+i.qtd+' '+i.un+'  ·  '+brlTxt(i.valor),fonte,9)); }
          } else { txt.replace(/></g,'>\n<').split('\n').slice(0,400).forEach(l=>linha(l,fonte,7)); }
        } else falhas.push(a.nome+': tipo de arquivo sem impressão.');
      }catch(e){ falhas.push(a.nome+': não foi possível incluir ('+e.message+').'); }
    }
    if(!saida.getPageCount()) throw new Error('Nenhum arquivo pôde ser preparado. '+falhas.join(' '));
    const url=URL.createObjectURL(new Blob([await saida.save()],{type:'application/pdf'})), nomePdf='documentos-'+hoje()+'.pdf', qt=arqs.length-falhas.length;
    modal('Pronto para imprimir — '+qt+' documento'+(qt>1?'s':'')+' · '+saida.getPageCount()+' página'+(saida.getPageCount()>1?'s':''), `
      <div class="acoes" style="margin:0 0 10px"><button class="btn" type="button" id="pImp">Imprimir</button><a class="btn sec" href="${url}" target="_blank" rel="noopener">Abrir em nova aba</a><a class="btn sec" href="${url}" download="${nomePdf}">Baixar PDF</a></div>
      ${falhas.length?`<div class="caixa-aviso"><strong>Não incluídos</strong><ul class="lista-msg">${falhas.map(f=>`<li>${esc(f)}</li>`).join('')}</ul></div>`:''}
      <iframe id="pFrame" src="${url}" title="Documentos para imprimir" style="width:100%;height:68vh;border:1px solid var(--linha);border-radius:8px"></iframe>`);
    $('#dlg').classList.add('largo');
    $('#pImp').onclick=()=>{ try{ $('#pFrame').contentWindow.focus(); $('#pFrame').contentWindow.print(); }catch(e){ window.open(url,'_blank'); } };
  }catch(e){ toast(e.message,true); }
  finally{ if(btn){ btn.disabled=false; btn.textContent=txtOrig; } }
}

/* ---------- Foto da nota (mesmo processo do portal do cliente) ---------- */
async function prepararFoto(f){
  const url=URL.createObjectURL(f);
  try{
    // decodifica já reduzida (createImageBitmap) para não estourar a memória do celular com fotos de 12+ megapixels
    const max=2000; let fonte=null, W0, H0;
    try{ const b0=await createImageBitmap(f); W0=b0.width; H0=b0.height; const k0=Math.min(1,max/Math.max(W0,H0));
      if(k0<1){ b0.close&&b0.close(); fonte=await createImageBitmap(f,{resizeWidth:Math.round(W0*k0), resizeHeight:Math.round(H0*k0), resizeQuality:'high'}); } else fonte=b0; }
    catch(e){ fonte=await new Promise((ok,er)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=()=>er(new Error('imagem')); i.src=url; }); W0=fonte.naturalWidth; H0=fonte.naturalHeight; }
    const k=Math.min(1, max/Math.max(W0,H0));
    const cv=document.createElement('canvas'); cv.width=Math.round(W0*k); cv.height=Math.round(H0*k);
    const cx=cv.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,cv.width,cv.height); cx.drawImage(fonte,0,0,cv.width,cv.height);
    if(fonte.close) fonte.close();
    const blob=await new Promise(ok=>cv.toBlob(ok,'image/jpeg',0.85));
    const w=400, h=Math.max(1,Math.round(cv.height*w/cv.width)), c2=document.createElement('canvas'); c2.width=w; c2.height=h;
    const x2=c2.getContext('2d'); x2.drawImage(cv,0,0,w,h); const d=x2.getImageData(0,0,w,h).data;
    const g=new Float32Array(w*h); let soma=0; for(let i=0;i<w*h;i++){ g[i]=0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2]; soma+=g[i]; }
    let m=0,m2=0,n=0; for(let y=1;y<h-1;y++) for(let x=1;x<w-1;x++){ const i=y*w+x, L=4*g[i]-g[i-1]-g[i+1]-g[i-w]-g[i+w]; m+=L; m2+=L*L; n++; }
    const varL=m2/n-(m/n)**2, brilho=soma/(w*h);
    const avisos=[]; if(varL<60) avisos.push('a foto parece tremida ou fora de foco'); if(brilho<70) avisos.push('a foto está escura');
    const nome=f.name.replace(/\.(heic|heif|png|webp|jpe?g)$/i,'')+'.jpg';
    return { arquivo:new File([blob], nome, {type:'image/jpeg'}), thumb:(()=>{ const t=document.createElement('canvas'), kt=96/Math.max(cv.width,cv.height); t.width=Math.round(cv.width*kt); t.height=Math.round(cv.height*kt); t.getContext('2d').drawImage(cv,0,0,t.width,t.height); const u=t.toDataURL('image/jpeg',.7); cv.width=cv.height=c2.width=c2.height=0; return u; })(), aviso: avisos.length?'Atenção: '+avisos.join(' e ')+'. Se puder, tire outra foto.':'' };
  } finally { URL.revokeObjectURL(url); }
}
let _jspdf=null;
function carregarJsPDF(){ if(window.jspdf) return Promise.resolve(window.jspdf); if(!_jspdf) _jspdf=new Promise((ok,er)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'; s.onload=()=>ok(window.jspdf); s.onerror=()=>{ _jspdf=null; er(new Error('sem internet para carregar o gerador de PDF')); }; document.head.appendChild(s); }); return _jspdf; }
async function fotosEmPdf(itens){
  const { jsPDF }=await carregarJsPDF(); let doc=null;
  for(const it of itens){
    const src=URL.createObjectURL(it.arquivo);
    const img=await new Promise((ok,er)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=er; i.src=src; });
    const o=img.width>img.height?'l':'p';
    if(!doc) doc=new jsPDF({orientation:o, unit:'pt', format:'a4'}); else doc.addPage('a4', o);
    const W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight(), k=Math.min((W-24)/img.width,(H-24)/img.height);
    doc.addImage(img,'JPEG',(W-img.width*k)/2,(H-img.height*k)/2,img.width*k,img.height*k); URL.revokeObjectURL(src);
  }
  return new File([doc.output('blob')], 'nota-'+hoje()+'-'+itens.length+'-paginas.pdf', {type:'application/pdf'});
}

  document.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>{ const l=G.lancs.find(x=>x.id===b.dataset.ed); if(!l) return; G.cli=l.clienteId; editarLanc(l); });

  document.querySelectorAll('[data-ca]').forEach(b=>b.onclick=()=>{ const m=prompt('Motivo do cancelamento:'); if(m) acao(b, async()=>{ await api('ges.lancamento.cancelar',{id:b.dataset.ca, motivo:m}); toast('Lançamento cancelado.'); carregarLanc(); }); });

/* ---------- Dividir um lançamento em parcelas (nota a prazo) ---------- */
// mesmas regras do servidor: "COMPRA DE X - PARC. 2/3 - NF 796"
const histBase = h => String(h||'').replace(/\s*-?\s*PARC\.?\s*\d+\s*\/\s*\d+/ig,'').replace(/\s*-\s*NF(-?E)?\b.*$/i,'').replace(/\s*-\s*$/,'').trim();
const histParcela = (h,i,N,nd) => { const d=String(nd||'').replace(/\D/g,''), nf=d?String(+d):String(nd||'').trim(); return (histBase(h)+' - PARC. '+i+'/'+N+(nf&&nf!=='S/N'?' - NF '+nf:'')).toUpperCase().slice(0,200); };
function parcelarDlg(l){
  const c=G.clientes.find(x=>x.id===l.clienteId)||cliAtual(), total=l.entrada||l.saida;
  const prox=(d,k,tipo)=>{ const x=new Date(d+'T12:00:00'); if(tipo==='m') x.setMonth(x.getMonth()+k); else x.setDate(x.getDate()+k*(+tipo)); return x.toISOString().slice(0,10); };
  let linhas=[];
  const tipo=String(l.tipoLanc||(l.entrada?'1':'2'));
  modal('Dividir em parcelas — '+(c?c.nome:''), `<div id="pqForm">
    <div class="acoes" style="margin:0 0 10px">${l.documentoId?'<button class="btn sec" type="button" id="pqLado">Ver a NF ao lado</button><button class="btn" type="button" id="pqNF">Buscar parcelas na NF</button>':''}<span class="pequeno" id="pqMsg" style="align-self:center"></span></div>
    ${l.documentoId?'<details id="pqTrecho" hidden><summary class="pequeno" style="cursor:pointer">O que a leitura encontrou no quadro de faturas</summary><pre class="xml-cru" id="pqTxt"></pre></details>':''}
    <h4 class="rotulo-passo" style="margin-top:4px">1 · Dados iguais para todas as parcelas</h4>
    <form class="form" id="pqDados" onsubmit="return false">
      <label class="campo" style="flex-grow:2">Tipo de lançamento<select name="tipoLanc">${[1,2,3].map(k=>`<option value="${k}" ${String(k)===tipo?'selected':''}>${TIPO_LANC[k]}</option>`).join('')}</select></label>
      <label class="campo">Imóvel<select name="codImovel">${opcoesImovel(c,l.codImovel)}</select></label>
      <label class="campo">Conta<select name="codConta">${opcoesConta(c,l.codConta||'000')}</select></label>
      <label class="campo">Tipo de documento<select name="tipoDoc">${Object.keys(TIPO_DOC).map(k=>`<option value="${k}" ${String(l.tipoDoc||1)===k?'selected':''}>${k} — ${TIPO_DOC[k]}</option>`).join('')}</select></label>
      <label class="campo">Nº do documento<input name="numDoc" value="${esc(l.numDoc||'')}"></label>
      <label class="campo largo">Histórico <span class="pequeno">(sem parcela e sem NF — o sistema completa)</span><input name="historico" maxlength="160" value="${esc(histBase(l.historico))}"></label>
      <label class="campo">CPF/CNPJ do participante<input name="idPartic" id="pqDoc" inputmode="numeric" value="${esc(cpfFmt(l.idPartic||''))}"></label>
      <label class="campo" style="flex-grow:2">Nome do participante<input name="nomePartic" value="${esc(l.nomePartic||'')}"></label>
      <label class="campo largo">Categoria<select name="categoria" id="pqCat"></select></label>
      <label class="marcar largo"><input type="checkbox" name="conferido" checked> Lançar todas as parcelas já como <b>conferidas</b></label>
    </form>
    <h4 class="rotulo-passo">2 · Parcelas</h4>
    <div class="form"><label class="campo" style="flex:0 1 110px">Nº de parcelas<input type="number" id="pqN" min="2" max="60" value="2"></label>
      <label class="campo">1º pagamento<input type="date" id="pqD" value="${prox(l.data,1,'m')}"></label>
      <label class="campo">Intervalo<select id="pqI"><option value="m">Mensal</option><option value="30">A cada 30 dias</option><option value="28">A cada 28 dias</option><option value="15">A cada 15 dias</option><option value="7">Semanal</option></select></label>
      <button class="btn sec" type="button" id="pqGerar">Dividir em partes iguais</button></div>
    <div id="pqLista" style="margin-top:12px"></div>
    <p class="pequeno">Valor da nota: <b>${brl(total)}</b> · lançamento atual em ${dataBR(l.data)}. Ao lançar, ele fica cancelado com o motivo “Dividido em N parcelas” e cada parcela recebe a mesma NF anexada.</p>
    <div class="acoes"><button class="btn" type="button" id="pqOk" disabled>Lançar parcelas</button><button class="btn sec" type="button" onclick="$('#dlg').close()">Cancelar</button></div></div>`);
  $('#dlg').classList.add('largo');
  const f=$('#pqDados');
  const atCat=()=>{ const lista=f.tipoLanc.value==='2'?CATEG.despesa:CATEG.receita; const atual=f.categoria.value||l.categoria; f.categoria.innerHTML='<option value="">Sem categoria</option>'+lista.map(x=>`<option ${x===atual?'selected':''}>${esc(x)}</option>`).join(''); };
  f.tipoLanc.onchange=()=>{ atCat(); desenhar(); }; atCat();
  $('#pqDoc').addEventListener('blur',()=>{ const d=$('#pqDoc').value.replace(/\D/g,''); if(d.length===11||d.length===14) $('#pqDoc').value=cpfFmt(d); });
  f.historico.oninput=()=>desenhar(); f.numDoc.oninput=()=>desenhar();
  function desenhar(){
    const soma=linhas.reduce((t,p)=>t+(+p.valor||0),0), bate=Math.abs(soma-total)<=0.05, ok=linhas.length>=2 && bate && linhas.every(p=>p.data&&p.valor>0) && f.historico.value.trim();
    const N=linhas.length, ent=f.tipoLanc.value!=='2';
    $('#pqLista').innerHTML = N?`<div class="tabela"><table><thead><tr><th>Parcela</th><th>Data do ${ent?'recebimento':'pagamento'}</th><th class="v">Valor</th><th>Como fica o histórico no lançamento</th></tr></thead><tbody>${linhas.map((p,i)=>`<tr><td>${i+1}/${N}</td><td><input type="date" data-qd="${i}" value="${p.data}" style="padding:6px"></td><td class="v"><input data-qv="${i}" inputmode="decimal" value="${(+p.valor).toFixed(2).replace('.',',')}" style="width:110px;text-align:right;padding:6px"></td><td class="pequeno" style="font-weight:600;color:var(--tinta)">${esc(histParcela(f.historico.value,i+1,N,f.numDoc.value))}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td colspan="2">Soma das parcelas</td><td class="v" style="color:${bate?'var(--verde)':'var(--vermelho)'}">${brl(soma)}</td><td class="pequeno">${bate?'Confere com o valor da nota.':'Diferente do valor da nota ('+brl(total)+'). Ajuste os valores.'}</td></tr></tfoot></table></div>`:'';
    $('#pqOk').disabled=!ok; $('#pqOk').textContent=N?'Lançar '+N+' parcelas'+(f.conferido.checked?' como conferidas':''):'Lançar parcelas';
    document.querySelectorAll('[data-qd]').forEach(e=>e.onchange=()=>{ linhas[+e.dataset.qd].data=e.value; desenhar(); });
    document.querySelectorAll('[data-qv]').forEach(e=>e.onchange=()=>{ linhas[+e.dataset.qv].valor=Number(String(e.value).replace(/\./g,'').replace(',','.'))||0; desenhar(); });
  }
  f.conferido.onchange=desenhar;
  $('#pqGerar').onclick=()=>{ const n=Math.max(2,Math.min(60,+$('#pqN').value||2)), base=Math.floor(total/n*100)/100;
    linhas=Array.from({length:n},(_,i)=>({data:prox($('#pqD').value||l.data,i,$('#pqI').value), valor:i<n-1?base:Math.round((total-base*(n-1))*100)/100})); desenhar(); };
  if($('#pqNF')) $('#pqNF').onclick=()=>acao($('#pqNF'), async()=>{ $('#pqMsg').textContent='Lendo a NF…';
    const r=await api('ges.lancamento.lerParcelas',{id:l.id});
    if(r.trecho){ $('#pqTrecho').hidden=false; $('#pqTxt').textContent=r.trecho; }
    if(r.parcelas.length>=2){ linhas=r.parcelas.map(p=>({data:p.vencimento, valor:p.valor})); $('#pqN').value=linhas.length; $('#pqD').value=linhas[0].data;
      $('#pqMsg').textContent=r.parcelas.length+' parcelas encontradas na NF. Ajuste a data se alguma foi paga em outro dia.'; }
    else $('#pqMsg').textContent='Não encontrei as parcelas na NF. Informe o nº de parcelas e o 1º pagamento e clique em “Dividir em partes iguais”.';
    desenhar(); });
  // NF ao lado: documento à esquerda (zoom e seleção de texto), formulário à direita
  if($('#pqLado')) $('#pqLado').onclick=()=>{ const corpo=$('#dlgCorpo'), form=$('#pqForm');
    if($('#dlg').classList.contains('lado')){ $('#dlg').classList.remove('lado'); corpo.innerHTML=''; corpo.append(form); $('#pqLado').textContent='Ver a NF ao lado'; G.ladoALado=false; return; }
    $('#dlg').classList.add('lado'); corpo.innerHTML='<div class="lado-a-lado"><div id="ladoDoc"></div><div id="ladoForm"></div></div>'; $('#ladoForm').append(form);
    $('#pqLado').textContent='Fechar a NF ao lado'; G.ladoALado=true; montarVisor($('#ladoDoc'), l.documentoId, {driveUrl:l.docUrl}); };
  $('#pqOk').onclick=()=>acao($('#pqOk'), async()=>{ const d=dadosForm(f);
    const r=await api('ges.lancamento.parcelar',Object.assign(d,{id:l.id, parcelas:linhas}));
    $('#dlg').close(); toast(r.lancamentos.length+' parcelas lançadas'+(d.conferido?' e conferidas':'')+', cada uma com a NF anexada.');
    G.destacar=r.lancamentos.map(x=>x.id); posLanc(); });
  if(G.ladoALado && $('#pqLado')) $('#pqLado').click();
  if($('#pqNF')) $('#pqNF').click();
}

function abrirPortalVis(token){
  const url=API_URL+'?visualizar='+token;
  const jan=window.open(url,'_blank','noopener');
  modal('Ver como o cliente', `<p>${jan?'O portal foi aberto em outra aba no modo visualização (vale por 1 hora).':'O navegador bloqueou a nova aba. Use o botão abaixo.'}</p>
    <div class="acoes"><a class="btn" href="${esc(url)}" target="_blank" rel="noopener">Abrir o portal do cliente ↗</a><button class="btn sec" type="button" id="pvCop">Copiar link</button></div>
    <p class="pequeno">O portal é aberto pelo endereço do servidor do escritório, sem depender de pasta ou arquivo no computador. Se aparecer “Portal ainda não instalado no servidor”, siga a instrução da tela (uma vez só).</p>`);
  $('#pvCop').onclick=async()=>{ try{ await navigator.clipboard.writeText(url); toast('Link copiado. Cole numa aba nova do navegador.'); }catch(e){ toast('Não foi possível copiar.',true); } };
}

    $('#icForm').innerHTML = `<h3>${i.id?'Editar imóvel':'Novo imóvel'}</h3><form id="fI" class="form">
      ${f('codImovel','Código (001–999)','required maxlength="3"')}<label class="campo" style="flex-grow:3">Nome do imóvel<input name="nome" required value="${esc(i.nome||'')}"></label>
      ${f('cadItr','NIRF / CIB (ITR)')}${f('caepf','CAEPF')}${f('ie','Inscrição estadual')}
      <label class="campo" style="flex-grow:3">Endereço<input name="endereco" value="${esc(i.endereco||'')}"></label>${f('numero','Número')}${f('complemento','Complemento')}${f('bairro','Bairro/localidade')}
      ${f('uf','UF','maxlength="2" required')}${f('codMun','Código IBGE do município','required maxlength="7"')}${f('cep','CEP','required')}
      <label class="campo">Tipo de exploração<select name="tipoExploracao">${Object.keys(TIPO_EXPL).map(k=>`<option value="${k}" ${String(i.tipoExploracao||1)===k?'selected':''}>${k} — ${TIPO_EXPL[k]}</option>`).join('')}</select></label>
      ${f('participacao','Participação (%)','inputmode="decimal"')}
      ${i.id?`<label class="campo">Situação<select name="ativo"><option value="SIM">Ativo</option><option value="NÃO" ${i.ativo==='NÃO'?'selected':''}>Inativo</option></select></label>`:''}
      <p class="auto-msg largo" id="iAuto" hidden></p>
      <button class="btn" type="submit">Salvar imóvel</button></form><p class="pequeno">Em condomínio, parceria ou arrendamento, informe os demais participantes ao contador: o registro 0045 deve ser conferido antes da transmissão.</p>`;
    ligarCEP($('#fI'), avisoForm('iAuto'));

async function abaRel(){

      <div class="form"><label class="campo">Ano-calendário<select id="tAno">${[ano,ano-1,ano-2].map(a=>`<option ${a===ano-1?'selected':''}>${a}</option>`).join('')}</select></label>

/* ---------- Gráfico do livro caixa sintético ---------- */
const COR_ENT='#2B5590', COR_SAI='#E85B4A';
const MES_C=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const kBRL = v => { const a=Math.abs(v), s=v<0?'−':''; return a>=1e6?s+'R$ '+(a/1e6).toFixed(1).replace('.',',')+' mi':a>=1e3?s+'R$ '+Math.round(a/1e3)+' mil':s+'R$ '+Math.round(a); };
function escalaNice(max){ if(max<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(max))), f=max/p; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p; }
function marcas(lo,hi){ const st=escalaNice(((hi-lo)||1)/4), a=Math.floor(lo/st)*st, b=Math.ceil(hi/st)*st, t=[]; for(let v=a; v<=b+st/2; v+=st) t.push(Math.round(v*100)/100); return t; }
const barraTopo=(x,y,w,h,r)=>{ if(h<=0) return ''; r=Math.min(r,w/2,h); return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`; };
function grafMensal(e,s,rot){
  rot=rot||MES_C; const n=e.length;
  const W=720,H=240,L=72,R=10,T=14,B=28, iw=W-L-R, ih=H-T-B, tk=marcas(0,Math.max(...e,...s,1)), top=tk[tk.length-1], gw=iw/n, bw=Math.max(3,Math.min(18,(gw-10)/2));
  let g=''; for(const v of tk){ const y=T+ih-ih*v/top; g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#E6ECF4"/><text x="${L-8}" y="${y+4}" text-anchor="end" class="eixo">${kBRL(v)}</text>`; }
  let b='', hit='';
  for(let m=0;m<n;m++){ const cx=L+gw*m+gw/2, he=ih*e[m]/top, hs=ih*s[m]/top;
    b+=`<path d="${barraTopo(cx-bw-1,T+ih-he,bw,he,4)}" fill="${COR_ENT}"/><path d="${barraTopo(cx+1,T+ih-hs,bw,hs,4)}" fill="${COR_SAI}"/>`;
    b+=`<text x="${cx}" y="${H-8}" text-anchor="middle" class="eixo">${(n<=12||m%Math.ceil(n/12)===0)?rot[m]:''}</text>`;
    hit+=`<rect x="${L+gw*m}" y="${T}" width="${gw}" height="${ih}" fill="transparent" data-tip="<b>${rot[m]}</b><br>Entradas: ${brl(e[m])}<br>Saídas: ${brl(s[m])}<br>Saldo do mês: ${brl(e[m]-s[m])}"/>`; }
  return `<svg viewBox="0 0 ${W} ${H}" class="graf" role="img" aria-label="Entradas e saídas por mês">${g}<line x1="${L}" x2="${W-R}" y1="${T+ih}" y2="${T+ih}" stroke="#B9C6D6"/>${b}${hit}</svg>`;
}
function ligarTooltip(raiz){
  if(!raiz) return;
  let tip=document.getElementById('tipG'); if(!tip){ tip=document.createElement('div'); tip.id='tipG'; tip.setAttribute('role','tooltip'); document.body.appendChild(tip); }
  raiz.querySelectorAll('[data-tip]').forEach(el=>{
    el.addEventListener('mousemove',ev=>{ tip.innerHTML=el.dataset.tip; tip.style.display='block';
      const x=Math.min(ev.clientX+14, innerWidth-tip.offsetWidth-8), y=Math.max(8, ev.clientY-tip.offsetHeight-12); tip.style.left=x+'px'; tip.style.top=y+'px'; });
    el.addEventListener('mouseleave',()=>{ tip.style.display='none'; });
  });
}
function totais(ls){ const e=ls.reduce((t,l)=>t+l.entrada,0), s=ls.reduce((t,l)=>t+l.saida,0); return {e,s,r:e-s}; }
function montarRelatorio(tipo, ls, cli, p){
  cli = cli || {}; const t = totais(ls);
  const titulo = {analitico:'Livro caixa da atividade rural',mensal:'Livro caixa sintético da atividade rural',categoria:'Resumo por tipo de receita e despesa'}[tipo];
  const cab = `<div class="rel-cab"><div><img src="${LOGO_CLARO}" alt="França">${esc(titulo)}</div><div style="text-align:right">${esc(cli.nome)} · ${docRot(cli)} ${cpfFmt(cli.cpf)}<br>Período ${dataBR(p.ini)} a ${dataBR(p.fim)} · emitido em ${new Date().toLocaleString('pt-BR')}</div></div>
    <h2 style="margin-top:0">${esc(titulo)} — ${esc(cli.nome)} — ${dataBR(p.ini)} a ${dataBR(p.fim)}</h2>`;
  const nc = ls.filter(l=>!l.conferido).length;
  const rod = `<p class="pequeno" style="margin-top:14px">Regime de caixa.</p>`;
  if (!ls.length) return cab + '<div class="bloco vazio">Nenhum lançamento no período.</div>';
  if (tipo==='analitico'){
    let s=0;
    return cab + `<div class="tabela"><table><thead><tr><th>Data</th><th>Documento</th><th>Histórico</th><th>Participante</th><th>Imóvel</th><th>Conta</th><th class="v">Entrada</th><th class="v">Saída</th><th class="v">Saldo</th></tr></thead><tbody>${
      ls.map(l=>{ s+=l.entrada-l.saida; return `<tr><td>${dataBR(l.data)}</td><td>${esc(TIPO_DOC[l.tipoDoc]||'')} ${esc(l.numDoc)}</td><td>${esc(l.historico)}</td><td>${esc(l.nomePartic||'')} ${cpfFmt(l.idPartic)}</td><td>${esc(l.codImovel)}</td><td>${esc(l.codConta)}</td><td class="v">${l.entrada?brl(l.entrada):''}</td><td class="v">${l.saida?brl(l.saida):''}</td><td class="v">${brl(s)}</td></tr>`;}).join('')
    }</tbody><tfoot><tr><td colspan="6">Totais do período</td><td class="v">${brl(t.e)}</td><td class="v">${brl(t.s)}</td><td class="v">${brl(t.r)}</td></tr></tfoot></table></div>` + rod;
  }
  if (tipo==='mensal'){
    const m={}; ls.forEach(l=>{ const k=l.data.slice(0,7); m[k]=m[k]||{e:0,s:0}; m[k].e+=l.entrada; m[k].s+=l.saida; });
    // meses exibidos: do 1º mês com movimento (ou início do período) até o último com movimento ou o mês atual, dentro do período
    const ord=Object.keys(m).sort(), mesHoje=hoje().slice(0,7), ks=[];
    let a=(p.ini||'').slice(0,7), z=(p.fim||'').slice(0,7);
    if(ord.length){ if(!a||ord[0]>a) a=ord[0]; const ult=ord[ord.length-1]>mesHoje?ord[ord.length-1]:mesHoje; if(!z||ult<z) z=ult; }
    else { a=a&&a>mesHoje.slice(0,4)+'-01'?a:''; z=''; }
    if(a&&z){ let [y,mm]=a.split('-').map(Number); for(let i=0;i<120;i++){ const k=y+'-'+String(mm).padStart(2,'0'); if(k>z) break; ks.push(k); mm++; if(mm>12){mm=1;y++;} } }
    ord.forEach(k=>{ if(!ks.includes(k)) ks.push(k); }); ks.sort();
    const NM=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
    let ac=0; const linhas=ks.map(k=>{ const v=m[k]||{e:0,s:0}, r=v.e-v.s; ac+=r; return {k,e:v.e,s:v.s,r,ac}; });
    const neg=v=>v<0?' style="color:#C0392B"':'';
    const tab = `<div class="tabela"><table><thead><tr><th>Mês</th><th class="v">Entradas</th><th class="v">Saídas</th><th class="v">Saldo do mês</th><th class="v">Saldo acumulado</th></tr></thead><tbody>${
      linhas.map(x=>`<tr><td>${NM[+x.k.slice(5)-1]}/${x.k.slice(0,4)}</td><td class="v">${brl(x.e)}</td><td class="v">${brl(x.s)}</td><td class="v"${neg(x.r)}>${brl(x.r)}</td><td class="v"${neg(x.ac)}>${brl(x.ac)}</td></tr>`).join('')
    }</tbody><tfoot><tr><td>Total do período</td><td class="v">${brl(t.e)}</td><td class="v">${brl(t.s)}</td><td class="v"${neg(t.r)}>${brl(t.r)}</td><td class="v"${neg(t.r)}>${brl(t.r)}</td></tr></tfoot></table></div>`;
    return cab + (linhas.length?`<div class="sint-graf"><div class="legenda" style="margin:0 0 4px"><span><i style="background:${COR_ENT}"></i>Entradas</span><span><i style="background:${COR_SAI}"></i>Saídas</span></div>${grafMensal(linhas.map(x=>x.e),linhas.map(x=>x.s),linhas.map(x=>MES_C[+x.k.slice(5)-1]+(ks.length>12||ks[0].slice(0,4)!==ks[ks.length-1].slice(0,4)?'/'+x.k.slice(2,4):'')))}</div>`:'') + tab + rod;
  }
  const g={}; ls.forEach(l=>{ const k=(l.entrada?'Receita':'Despesa')+'|'+(l.categoria||'Sem classificação'); g[k]=(g[k]||0)+(l.entrada||l.saida); });
  const linhas = tk => Object.keys(g).filter(k=>k.indexOf(tk)===0).sort().map(k=>`<tr><td>${esc(k.split('|')[1])}</td><td class="v">${brl(g[k])}</td></tr>`).join('');
  return cab + `<div class="tabela"><table><thead><tr><th>Receitas</th><th class="v">Valor</th></tr></thead><tbody>${linhas('Receita')||'<tr><td colspan="2">—</td></tr>'}</tbody><tfoot><tr><td>Total de receitas</td><td class="v">${brl(t.e)}</td></tr></tfoot></table></div>
    <div class="tabela" style="margin-top:14px"><table><thead><tr><th>Despesas de custeio e investimentos</th><th class="v">Valor</th></tr></thead><tbody>${linhas('Despesa')||'<tr><td colspan="2">—</td></tr>'}</tbody><tfoot><tr><td>Total de despesas</td><td class="v">${brl(t.s)}</td></tr><tr><td>Resultado do período</td><td class="v">${brl(t.r)}</td></tr></tfoot></table></div>` + rod;
}
function baixarCSV(ls, nome){
  if (!ls.length){ toast('Gere o relatório de um período com lançamentos.',true); return; }
  const n=v=>Number(v||0).toFixed(2).replace('.',','), q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const linhas=[['Data','Imóvel','Conta','Nº documento','Tipo documento','Histórico','CPF/CNPJ participante','Participante','Tipo lançamento','Categoria','Entrada','Saída','Conferido','Origem'].join(';')]
    .concat(ls.map(l=>[dataBR(l.data),l.codImovel,l.codConta,l.numDoc,TIPO_DOC[l.tipoDoc]||'',l.historico,l.idPartic,l.nomePartic,TIPO_LANC[l.tipoLanc]||'',l.categoria,n(l.entrada),n(l.saida),l.conferido?'Sim':'Não',l.origem].map(q).join(';')));
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['\ufeff'+linhas.join('\r\n')],{type:'text/csv;charset=utf-8'})); a.download=nome; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

    <tr><td>Escrituração</td><td>Livro caixa pelo regime de caixa; LCDPR acima de R$ 4,8 milhões</td><td>Segue o regime tributário: livro caixa (Simples e, opcionalmente, Presumido) ou contabilidade completa por competência (Real)</td></tr>
    <tr><td>Imposto de renda</td><td>Ficha Atividade Rural da DIRPF: resultado tributado ou arbitramento de 20% da receita bruta</td><td>IRPJ e CSLL pelo regime da empresa (Simples, Presumido ou Real)</td></tr>

  <h2>Penalidades do LCDPR (pessoa física)</h2>

/* ---------- Links oficiais ---------- */
const LINKS_UTEIS = [
  {nome:'Portal e-CAC (Receita Federal)', url:'https://cav.receita.fazenda.gov.br/autenticacao/login', uso:'Caixa Postal, intimações, procurações e transmissão de declarações'},
  {nome:'LCDPR — página oficial da Receita', url:'https://www.gov.br/receitafederal/pt-br/assuntos/orientacao-tributaria/declaracoes-e-demonstrativos/lcdpr-livro-caixa-digital-do-produtor-rural', uso:'Leiaute, manual, programa validador e perguntas e respostas'},
  {nome:'Notícias da Receita Federal', url:'https://www.gov.br/receitafederal/pt-br/assuntos/noticias', uso:'Operações de fiscalização e mudanças de regras'},
  {nome:'Diário Oficial da União', url:'https://www.in.gov.br/', uso:'Instruções normativas, atos declaratórios e leis'},
  {nome:'Portal Nacional da NF-e', url:'https://www.nfe.fazenda.gov.br/portal/', uso:'Consulta de notas fiscais eletrônicas'},
  {nome:'eSocial', url:'https://www.gov.br/esocial/pt-br', uso:'Empregados rurais, folha e obrigações trabalhistas'},
  {nome:'CRC-SP', url:'https://www.crcsp.org.br/', uso:'Informativos para a profissão contábil'}
];
const ECAC = LINKS_UTEIS[0].url;
const linkar = s => esc(s).replace(/https:\/\/[^\s<]+/g, u=>`<a href="${u}" target="_blank" rel="noopener">${u}</a>`)
  .replace(/\be-CAC\b/g, `<a href="${ECAC}" target="_blank" rel="noopener">e-CAC</a>`).replace(/\n/g,'<br>');
const comEcac = (texto, links) => { const o=(links||[]).slice(); if(/e-?cac/i.test(texto||'') && !o.some(l=>/cav\.receita\.fazenda/.test(l.url))) o.unshift({nome:LINKS_UTEIS[0].nome,url:ECAC}); return o; };
const botoesLinks = (links, cls) => links.length?`<div class="links-of ${cls||''}">${links.map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.nome)} ↗</a>`).join('')}</div>`:'';

function campoLinks(sel){
  sel=sel||[]; const urls=sel.map(l=>l.url), extras=sel.filter(l=>!LINKS_UTEIS.some(u=>u.url===l.url));
  return `<fieldset class="largo links-esc"><legend>Links para incluir</legend>
    <div class="links-op">${LINKS_UTEIS.map(l=>`<label class="marcar"><input type="checkbox" data-link="${esc(l.url)}" data-nome="${esc(l.nome)}" ${urls.includes(l.url)?'checked':''}> ${esc(l.nome)}</label>`).join('')}</div>
    <label class="campo" style="margin-top:10px">Outros links (um por linha: Nome | https://…)<textarea data-extras rows="2" style="min-height:56px">${esc(extras.map(l=>l.nome+' | '+l.url).join('\n'))}</textarea></label>
    <span class="pequeno">Quando o texto cita o e-CAC, o link de acesso entra sozinho.</span></fieldset>`;
}
function lerLinks(f){
  const out=[...f.querySelectorAll('[data-link]:checked')].map(i=>({nome:i.dataset.nome,url:i.dataset.link}));
  (f.querySelector('[data-extras]').value||'').split('\n').forEach(l=>{ const p=l.includes('|')?l.split('|').map(x=>x.trim()):['',l.trim()]; if(/^https:\/\/\S+$/i.test(p[1])) out.push({nome:p[0]||p[1],url:p[1]}); });
  return out;
}

    <label class="campo largo">Texto<textarea name="texto" maxlength="3000" required style="min-height:130px">${esc(m.texto||'')}</textarea></label>
    ${campoLinks(m.links)}
    <label class="campo">Enviar para<select name="alvo" id="mAlvo">${Object.keys(ALVO).map(k=>`<option value="${k}" ${k===(m.alvo||'TODOS')?'selected':''}>${ALVO[k]}</option>`).join('')}</select></label>

    <button class="btn" type="submit">Salvar e escolher o envio</button></form>`);
  $('#mAlvo').onchange=()=>$('#mCli').hidden=$('#mAlvo').value!=='SEL';

function abaMsgSilenciosa(){ if(G.aba==='msg') abaMsg(); }

async function enviarMsg(m){
  const links=comEcac(m.texto,m.links);
  modal('Enviar: '+m.titulo, `<div class="previa"><b>${esc(m.titulo)}</b><p>${linkar(m.texto.replace(/\{nome\}/gi,'[nome do cliente]'))}</p>${botoesLinks(links)}</div>
    <div class="canal" role="radiogroup" aria-label="Canal de envio">
      <button type="button" class="btn sec" data-canal="WHATSAPP" aria-pressed="false">WhatsApp</button>
      <button type="button" class="btn sec" data-canal="EMAIL" aria-pressed="false">E-mail</button></div>
    <div id="mDest"><p class="pequeno">Escolha o canal acima.</p></div>`);
  let dest;
  try{ dest = await api('ges.mensagem.destinatarios',{id:m.id}); }catch(e){ $('#mDest').innerHTML=`<p class="erro-msg">${esc(e.message)}</p>`; return; }
  const escolher = canal => { document.querySelectorAll('[data-canal]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.canal===canal)); canal==='EMAIL'?listaEmail():listaWhats(); };
  document.querySelectorAll('[data-canal]').forEach(b=>b.onclick=()=>escolher(b.dataset.canal));
  if(!dest.length){ $('#mDest').innerHTML='<p class="pequeno">Nenhum cliente ativo neste grupo de destinatários.</p>'; return; }

  function listaWhats(){
    $('#mDest').innerHTML = `<p class="pequeno">Cada botão abre o WhatsApp com a mensagem pronta e personalizada. Confira e toque em enviar; o cliente fica marcado como enviado.</p>
      <div class="tabela"><table><tbody>${dest.map(c=>`<tr><td>${esc(c.nome)}<br><span class="pequeno">${esc(c.telefone||'sem telefone no cadastro')}</span></td>
        <td>${c.enviadoWhats?'<span class="chip ok">Enviado</span>':''}</td>
        <td style="text-align:right"><a class="btn peq ${c.temWhats?'':'sec'}" href="${esc(c.temWhats?c.whatsUrl:'https://wa.me/?text='+encodeURIComponent(c.textoWhats))}" target="_blank" rel="noopener" data-w="${c.id}">${c.temWhats?'Abrir WhatsApp':'Escolher contato'}</a>
        <button class="btn sec peq" type="button" data-copiar="${c.id}">Copiar texto</button></td></tr>`).join('')}</tbody></table></div>`;
    document.querySelectorAll('[data-w]').forEach(a=>a.addEventListener('click',()=>{ const c=dest.find(x=>x.id===a.dataset.w); c.enviadoWhats=true;
      api('ges.mensagem.whats',{id:m.id, clienteId:c.id}).catch(()=>{}); setTimeout(listaWhats,300); }));
    document.querySelectorAll('[data-copiar]').forEach(b=>b.onclick=async()=>{ try{ await navigator.clipboard.writeText(dest.find(x=>x.id===b.dataset.copiar).textoWhats); toast('Texto copiado.'); }catch(e){ toast('Não foi possível copiar.',true); } });
  }

    const ok=c=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(c.email);

/* ---------- Preenchimento automático: CNPJ (Receita, via BrasilAPI) e CEP (ViaCEP) ---------- */
async function buscarJSON(url){ const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),12000);
  try{ const r=await fetch(url,{signal:ctl.signal}); if(!r.ok) throw new Error('HTTP '+r.status); return await r.json(); } finally{ clearTimeout(t); } }
function cnpjOk(c){ c=String(c).replace(/\D/g,''); if(c.length!==14||/^(\d)\1+$/.test(c)) return false;
  const calc=n=>{ let s=0,p=n-7; for(let i=0;i<n;i++){ s+=+c[i]*p--; if(p<2)p=9; } const r=s%11; return r<2?0:11-r; }; return calc(12)===+c[12]&&calc(13)===+c[13]; }
async function consultarCNPJ(cnpj){
  try{
    const d=await buscarJSON('https://brasilapi.com.br/api/cnpj/v1/'+cnpj);
    const reg=(d.regime_tributario||[]).slice().sort((a,b)=>(b.ano||0)-(a.ano||0))[0];
    return { nome:d.razao_social, fantasia:d.nome_fantasia, endereco:[d.descricao_tipo_de_logradouro,d.logradouro].filter(Boolean).join(' '), numero:d.numero, complemento:d.complemento,
      bairro:d.bairro, uf:d.uf, codMun:d.codigo_municipio_ibge?String(d.codigo_municipio_ibge):'', cep:d.cep, email:d.email, telefone:d.ddd_telefone_1,
      situacao:d.descricao_situacao_cadastral, atividade:d.cnae_fiscal_descricao, municipio:d.municipio,
      simples:d.opcao_pelo_simples===true, formaTrib:reg?String(reg.forma_de_tributacao||''):'', fonte:'BrasilAPI' };
  }catch(e){
    const d=await buscarJSON('https://publica.cnpj.ws/cnpj/'+cnpj), es=d.estabelecimento||{};
    return { nome:d.razao_social, fantasia:es.nome_fantasia, endereco:[es.tipo_logradouro,es.logradouro].filter(Boolean).join(' '), numero:es.numero, complemento:es.complemento,
      bairro:es.bairro, uf:(es.estado||{}).sigla, codMun:(es.cidade||{}).ibge_id?String(es.cidade.ibge_id):'', cep:es.cep, email:es.email,
      telefone:(es.ddd1||'')+(es.telefone1||''), situacao:es.situacao_cadastral, atividade:(es.atividade_principal||{}).descricao, municipio:(es.cidade||{}).nome,
      simples:((d.simples||{}).simples||'')==='Sim', formaTrib:'', fonte:'CNPJ.ws' };
  }
}
async function consultarCEP(cep){
  const d=await buscarJSON('https://viacep.com.br/ws/'+cep+'/json/');
  if(d.erro) throw new Error('CEP não encontrado.');
  return { endereco:d.logradouro, bairro:d.bairro, uf:d.uf, codMun:d.ibge, municipio:d.localidade, complemento:d.complemento };
}
// Preenche só os campos vazios do formulário; o que já foi digitado não é apagado
function preencherVazios(f, dados){
  let n=0; Object.keys(dados).forEach(k=>{ const el=f.elements[k], v=dados[k]; if(!el||v==null||v==='') return;
    if(!String(el.value).trim()){ el.value = k==='cep'?String(v).replace(/\D/g,''):k==='email'?String(v).trim().toLowerCase():el.tagName==='SELECT'?String(v):String(v).trim().toUpperCase(); el.classList.add('auto'); n++; } }); return n;
}
function ligarCEP(f, aviso){
  const el=f.elements.cep; if(!el) return;
  el.addEventListener('blur', async()=>{ const cep=el.value.replace(/\D/g,''); if(cep.length!==8) return;
    try{ const d=await consultarCEP(cep); const n=preencherVazios(f,d); if(aviso) aviso(n?`Endereço de ${d.municipio}/${d.uf} preenchido pelo CEP. Confira o número e o complemento.`:'', 'ok'); }
    catch(e){ if(aviso) aviso('Não foi possível consultar o CEP: '+e.message,'erro'); } });
}
function ligarCNPJ(f, aviso){
  const el=f.elements.cpf, btn=f.querySelector('#cBuscar');
  const buscar=async()=>{ const cnpj=el.value.replace(/\D/g,'');
    if($('#cTipo').value!=='PJ') return;
    if(!cnpjOk(cnpj)){ aviso('CNPJ inválido: confira os 14 dígitos.','erro'); return; }
    aviso('Consultando o CNPJ na base pública da Receita Federal…','');
    if(btn) btn.disabled=true;
    try{
      const d=await consultarCNPJ(cnpj);
      const t=d.formaTrib.toUpperCase();
      d.regimeTributario = d.simples?'SIMPLES':/PRESUMIDO/.test(t)?'PRESUMIDO':/ARBITRADO/.test(t)?'ARBITRADO':/REAL/.test(t)?'REAL':'';
      const n=preencherVazios(f,d);
      const sit=String(d.situacao||'').toUpperCase();
      aviso(`${n} campo(s) preenchido(s) a partir da Receita Federal (${d.fonte}). Situação cadastral: ${d.situacao||'não informada'}${d.atividade?' · Atividade principal: '+d.atividade:''}.`
        + (d.regimeTributario?'':' Regime tributário não identificado na base pública: selecione manualmente.')
        + ' Confira tudo antes de salvar; a base pública pode estar desatualizada.', sit && sit!=='ATIVA'?'erro':'ok');
    }catch(e){ aviso('Não foi possível consultar o CNPJ agora ('+e.message+'). Preencha manualmente ou tente de novo em instantes.','erro'); }
    finally{ if(btn) btn.disabled=false; }
  };
  if(btn) btn.onclick=buscar;
  el.addEventListener('blur',()=>{ if($('#cTipo').value==='PJ' && el.value.replace(/\D/g,'').length===14 && !f.elements.nome.value.trim()) buscar(); });
}
function avisoForm(id){ return (msg,tipo)=>{ const el=$('#'+id); if(!el) return; el.textContent=msg; el.className='auto-msg largo '+(tipo||''); el.hidden=!msg; }; }

/* ---------- Arquivos: leitura e base64 ---------- */
const lerB64 = f => new Promise((ok,er)=>{ const r=new FileReader(); r.onload=()=>ok(String(r.result).split(',')[1]); r.onerror=()=>er(new Error('Não foi possível ler o arquivo.')); r.readAsDataURL(f); });
const EXT_OK = /\.(pdf|xml|jpe?g|png|webp)$/i;
const mimeDe = n => ({pdf:'application/pdf',xml:'application/xml',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp'})[String(n).split('.').pop().toLowerCase()]||'';
let _jszip=null;
async function carregarJSZip(){
  if(window.JSZip) return window.JSZip;
  if(!_jszip) _jszip=new Promise((ok,er)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'; s.onload=()=>ok(window.JSZip); s.onerror=()=>er(new Error('Não foi possível carregar o leitor de ZIP.')); document.head.appendChild(s); });
  return _jszip;
}
// Expande arquivos .zip em seus PDFs/XMLs/fotos
async function expandirArquivos(files){
  const out=[];
  for(const f of files){
    if(/\.zip$/i.test(f.name)){
      const Z=await carregarJSZip(), z=await Z.loadAsync(f);
      for(const nome of Object.keys(z.files)){ const e=z.files[nome]; if(e.dir||!EXT_OK.test(nome)||/(^|\/)__MACOSX\//.test(nome)) continue;
        const blob=await e.async('blob'); out.push(new File([blob], nome.split('/').pop(), {type:mimeDe(nome)})); }
    } else if(EXT_OK.test(f.name)) out.push(f);
  }
  return out;
}

/* ---------- Envio em massa com identificação do produtor ---------- */
function envioMassa(){
  let fila=[], rodando=false;
  modal('Envio em massa — o sistema identifica o produtor', `<div class="passos">
    <p class="sub" style="margin-bottom:12px">Solte de uma vez notas de vários produtores (PDF, XML, fotos ou um arquivo .zip). O sistema procura o CPF ou CNPJ de cada arquivo entre os clientes cadastrados, guarda na pasta certa do Drive e lança no livro caixa. O XML é identificado com exatidão; PDF e foto dependem da leitura do texto.</p>

    <input type="file" id="mmArq" multiple accept=".pdf,.xml,.jpg,.jpeg,.png,.webp,.zip" hidden>

    <div id="mmLista"></div>

    <p class="pequeno">Nada é enviado antes de você clicar no botão. Arquivos que não forem identificados ficam na lista para você escolher o cliente.</p></div>`);

      if(!lst.length){ toast('Nenhum PDF, XML ou foto encontrado.',true); return; }
      lst.forEach(f=>{ if(!fila.some(x=>x.f.name===f.name&&x.f.size===f.size)) fila.push({f, st:f.size>15*1048576?'grande':'pendente'}); }); desenhar(); }
    catch(e){ toast(e.message,true); } };
  d.onclick=()=>inp.click(); d.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); inp.click(); } };

  d.ondrop=e=>{e.preventDefault();d.classList.remove('sobre');add([...e.dataTransfer.files]);}; inp.onchange=()=>{add([...inp.files]);inp.value='';};
  $('#mmFechar').onclick=()=>{ $('#dlg').close(); if(G.aba==='docs') $('#dFil').click(); };
  const optCli = (sel, lista) => `<option value="">Escolha o cliente…</option>${(lista&&lista.length?G.clientes.filter(c=>lista.some(x=>x.id===c.id)):G.clientes.filter(c=>c.ativo==='SIM')).map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.nome)} — ${cpfFmt(c.cpf)}</option>`).join('')}`;
  function linhaRes(x){
    if(x.st==='grande') return ['<span class="chip err">Maior que 15 MB</span>',''];
    if(x.st==='pendente') return ['<span class="chip neu">Aguardando envio</span>',''];
    if(x.st==='enviando') return ['<span class="chip neu">Identificando e lendo…</span>',''];
    if(x.erro) return ['<span class="chip err">Erro</span>', esc(x.erro)];
    if(x.r && !x.r.identificado) return ['<span class="chip rev">Produtor não identificado</span>', esc(x.r.mensagem)+
      `<div class="form" style="margin-top:6px;gap:6px"><select data-esc="${x.k}" style="flex:1 1 240px;font:inherit;padding:6px 8px;border:1px solid #C6D1DF;border-radius:7px">${optCli('', x.r.candidatos)}</select><button class="btn peq" type="button" data-mandar="${x.k}">Enviar para este cliente</button></div>`];
    const rs=x.r.resultados||[x.r];
    const st=rs.map(r=>{ if(r.duplicado) return '<span class="chip neu">Já existia</span>'; const s=STATUS_DOC[r.documento.status]||['neu',r.documento.status]; return `<span class="chip ${s[0]}">${s[1]}</span>`; }).join(' ');
    const det=rs.map(r=>`<b>${esc((r.cliente||{}).nome||x.clienteNome||'')}</b>${r.duplicado?' · '+esc(r.mensagem):' · '+(r.lancamentos||[]).map(l=>`${dataBR(l.data)} ${l.entrada?brl(l.entrada):'− '+brl(l.saida)}`).join(', ')+((r.erros||[]).length?' · '+r.erros.map(esc).join(' '):'')}`).join('<br>');
    return [st, det];
  }
  function desenhar(){
    fila.forEach((x,k)=>x.k=k);
    const pend=fila.filter(x=>x.st==='pendente').length, cnt=s=>fila.filter(s).length;
    const ok=cnt(x=>x.r&&x.r.identificado), ni=cnt(x=>x.r&&!x.r.identificado), er=cnt(x=>x.erro);
