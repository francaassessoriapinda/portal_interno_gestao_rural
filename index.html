        <td style="text-align:right">${x.st==='pendente'&&!rodando?`<button class="btn sec peq" type="button" data-rm="${x.k}">Remover</button>`:''}</td></tr>`; }).join('')}</tbody></table></div>`:'';
    document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ fila.splice(+b.dataset.rm,1); desenhar(); });
    document.querySelectorAll('[data-mandar]').forEach(b=>b.onclick=()=>{ const x=fila[+b.dataset.mandar], cid=document.querySelector(`[data-esc="${x.k}"]`).value;
      if(!cid){ toast('Escolha o cliente.',true); return; }
      acao(b, async()=>{ x.clienteNome=nomeCli(cid); const r=await api('ges.enviar',{clienteId:cid, arquivo:{nome:x.f.name,mime:x.f.type||mimeDe(x.f.name),base64:await lerB64(x.f)}, obs:'Envio em massa (cliente escolhido manualmente)'});
        x.r=Object.assign({identificado:true, resultados:[Object.assign({cliente:{id:cid,nome:nomeCli(cid)}}, r)]}); desenhar(); }); });
    const bt=$('#mmEnviar');
    if(rodando){ bt.disabled=true; bt.textContent='Processando… '+fila.filter(x=>x.r||x.erro).length+' de '+fila.filter(x=>x.st!=='grande').length; }
    else if(pend){ bt.disabled=false; bt.textContent='Enviar e identificar '+pend+' arquivo'+(pend>1?'s':''); }
    else { bt.disabled=true; bt.textContent='Escolha os arquivos acima'; }
    bt.hidden = !rodando && !pend && fila.length>0;
    $('#mmFechar').textContent = fila.some(x=>x.r||x.erro)&&!rodando ? 'Concluir' : 'Cancelar';
  }
  $('#mmEnviar').onclick=async()=>{
    rodando=true; desenhar();
    const fazer=async x=>{ x.st='enviando'; desenhar();
      try{ x.r=await api('ges.enviar.auto',{arquivo:{nome:x.f.name, mime:x.f.type||mimeDe(x.f.name), base64:await lerB64(x.f)}}); }catch(e){ x.erro=e.message; }
      x.st='feito'; desenhar(); };
    const lista=fila.filter(x=>x.st==='pendente'); let i=0;
    await Promise.all([0,1,2].map(async()=>{ while(i<lista.length){ const x=lista[i++]; await fazer(x); } }));
    rodando=false; desenhar();
  };
}

/* ---------- Anexar NF a um lançamento ---------- */
function escolherArquivo(accept){ return new Promise(ok=>{ const i=document.createElement('input'); i.type='file'; i.accept=accept||'.pdf,.xml,.jpg,.jpeg,.png,.webp'; i.onchange=()=>ok(i.files[0]||null); i.click(); }); }
async function anexarNoLancamento(id, f){
  if(f.size>15*1048576) throw new Error('O arquivo passa de 15 MB.');
  return api('ges.lancamento.anexar',{id, arquivo:{nome:f.name, mime:f.type||mimeDe(f.name), base64:await lerB64(f)}});
}

/* ---------- XML a partir do PDF ---------- */
async function gerarXml(id, btn){
  await acao(btn, async()=>{
    toast('Lendo o documento… isso pode levar alguns segundos.');
    const r=await api('ges.documento.xml',{id});
    const url=URL.createObjectURL(new Blob([r.xml],{type:'application/xml'})), dd=r.dados, sg=r.sugestao;
    const linha=(rot,v)=>`<tr><td class="pequeno" style="width:34%">${rot}</td><td>${v||'<span class="chip rev">não encontrado</span>'}</td></tr>`;
    const pessoa=p=>p&&(p.nome||p.cpfCnpj)?`${esc(p.nome||'')} ${p.cpfCnpj?`<span class="pequeno">${cpfFmt(p.cpfCnpj)}</span>`:''}`:'';
    modal('Dados lidos da nota', `
      <div class="tabela"><table><tbody>${r.etapas.map(e=>`<tr><td style="width:34%">${e.ok?'<span class="chip ok">ok</span>':'<span class="chip rev">não</span>'} ${esc(e.etapa)}</td><td class="pequeno">${esc(e.msg)}</td></tr>`).join('')}</tbody></table></div>
      <h3>O que foi lido (${r.metodo==='IA'?'leitura completa por IA':'leitura gratuita pelo OCR'})</h3>
      <div class="tabela"><table><tbody>
        ${linha('Número / série', dd.numero?esc(dd.numero)+(dd.serie?' / '+esc(dd.serie):''):'')}
        ${linha('Data de emissão', dataBR(dd.dataEmissao))}
        ${linha('Emitente', pessoa(dd.emitente))}
        ${linha('Destinatário', pessoa(dd.destinatario))}
        ${linha('Valor total da nota', dd.valorNota?brl(dd.valorNota):'')}
        ${linha('Chave de acesso', r.chave?`<span style="font-variant-numeric:tabular-nums">${r.chave.replace(/(\d{4})/g,'$1 ').trim()}</span> ${r.chaveValida?'<span class="chip ok">confere</span>':'<span class="chip err">não confere</span>'}`:'')}
        ${dd.itens?linha('Itens', dd.itens+' item(ns)'):''}
      </tbody></table></div>
      ${(sg.parcelas||[]).length?`<h3>Nota parcelada — ${sg.parcelas.length} parcela${sg.parcelas.length>1?'s':''}</h3>
        <div class="tabela"><table><thead><tr><th>Parcela</th><th>Data do ${sg.tipoLanc==='2'?'pagamento':'recebimento'}</th><th>Histórico</th><th class="v">Valor</th></tr></thead><tbody>${sg.parcelas.map((p,i)=>`<tr><td>${esc(p.parcela||'')}</td><td><input type="date" data-pd="${i}" value="${p.data}" style="padding:6px"></td><td class="pequeno">${esc(p.historico.toUpperCase())}</td><td class="v"><input data-pv="${i}" inputmode="decimal" value="${Number(p.valor).toFixed(2).replace('.',',')}" style="width:110px;text-align:right;padding:6px"></td></tr>`).join('')}</tbody></table></div>
        <p class="pequeno">Cada parcela vira um lançamento na data do vencimento, com a NF anexada. Se alguma foi paga em outra data, ajuste acima antes de lançar (regime de caixa).</p>`:''}
      ${r.avisos.length?`<ul class="lista-msg">${r.avisos.map(a=>`<li>${esc(a)}</li>`).join('')}</ul>`:''}
      <div class="acoes">
        ${r.temLancamento?'<span class="chip ok" style="align-self:center">Este documento já tem lançamento</span>':((sg.parcelas||[]).length?`<button class="btn" type="button" id="xParc">Lançar as ${sg.parcelas.length} parcelas</button><button class="btn sec" type="button" id="xLancar">Lançar como um lançamento só</button>`:`<button class="btn" type="button" id="xLancar">Lançar com estes dados</button>`)}
        <a class="btn sec" href="${url}" download="${esc(r.nomeArquivo)}">Baixar XML de dados</a>
        ${r.metodo!=='IA'?'<button class="btn sec" type="button" id="xCompleto">Tentar leitura completa (IA)</button>':''}
        ${r.chave?'<button class="btn sec" type="button" id="xCop">Copiar chave</button>':''}
      </div>
      <p class="pequeno">O XML gerado guarda os dados lidos para conferência e importação; ele não é o XML oficial da NF-e (não tem assinatura nem autorização da SEFAZ). O XML oficial é obtido com o emitente ou na SEFAZ pela chave de acesso.</p>`);
    if($('#xCop')) $('#xCop').onclick=async()=>{ try{ await navigator.clipboard.writeText(r.chave); toast('Chave copiada.'); }catch(e){ toast('Não foi possível copiar.',true); } };
    if($('#xCompleto')) $('#xCompleto').onclick=()=>acao($('#xCompleto'), async()=>{ const r2=await api('ges.documento.xml',{id, completo:true}); $('#dlg').close(); toast(r2.metodo==='IA'?'Leitura completa concluída.':'A IA não pôde ser usada: veja as etapas.', r2.metodo!=='IA'); gerarXml(id); });
    if($('#xParc')) $('#xParc').onclick=()=>acao($('#xParc'), async()=>{ const doc=r.documento;
      const parcelas=sg.parcelas.map((p,i)=>({parcela:p.parcela, historico:p.historico, data:document.querySelector(`[data-pd="${i}"]`).value, valor:Number(String(document.querySelector(`[data-pv="${i}"]`).value).replace(/\./g,'').replace(',','.'))}));
      const x=await api('ges.documento.lancarParcelas',{id:doc.id, parcelas, tipoLanc:sg.tipoLanc, idPartic:sg.idPartic, nomePartic:sg.nomePartic, numDoc:sg.numDoc, chave:sg.chave||r.chave, codImovel:doc.codImovel, codConta:doc.codConta});
      $('#dlg').close(); toast(x.lancamentos.length+' parcela(s) lançada(s) com a NF anexada.'+(x.erros.length?' Não lançadas: '+x.erros.join(' | '):''), !!x.erros.length);
      G.cli=doc.clienteId; G.lCli=doc.clienteId; G.destacar=x.lancamentos.map(l=>l.id); G.periodo={ini:'2000-01-01',fim:'2099-12-31'}; abrir('lanc'); });
    if($('#xLancar')) $('#xLancar').onclick=()=>{ const doc=r.documento; G.cli=doc.clienteId;
      editarLanc(Object.assign({documentoId:doc.id, docUrl:doc.driveUrl, codImovel:doc.codImovel, codConta:doc.codConta, origemDoc:doc.nomeArquivo}, sg)); };
  });
}

window.addEventListener('unhandledrejection', e=>{ if(/properties of null/.test(String(e.reason&&e.reason.message))) e.preventDefault(); });

/* ---------- Padrão: texto digitado em MAIÚSCULAS ---------- */
const NAO_MAIUSC = ['email','senha','atual','nova','conf','usuario','fonte'];
function ehCampoMaiusc(el){
  if(!el || !el.matches || !el.matches('input:not([type]),input[type="text"],input[type="search"],textarea')) return false;
  if(NAO_MAIUSC.includes(el.name) || el.hasAttribute('data-extras') || el.hasAttribute('data-livre')) return false;
  return !el.closest('#fBan,#fM,#fLogin,#fSenha,.login,#vLista');
}
document.addEventListener('input', e=>{ const el=e.target; if(!ehCampoMaiusc(el)) return;
  const v=el.value, u=v.toUpperCase(); if(v===u) return; const p=el.selectionStart; el.value=u; try{ el.setSelectionRange(p,p); }catch(_){} }, true);

/* ---------- Buscar nota pela chave de acesso ---------- */
function buscarPelaChave(chaveIni){
  modal('Buscar nota pela chave de acesso', `<form id="fCh" class="form">
    <label class="campo largo">Chave de acesso (44 dígitos da NF-e/CT-e ou 50 da NFS-e)<input name="chave" inputmode="numeric" required autocomplete="off" value="${esc(chaveIni||'')}" placeholder="Cole ou digite a chave; espaços e pontos são ignorados" style="font-variant-numeric:tabular-nums;letter-spacing:.5px"></label>
    <button class="btn" type="submit">Buscar</button></form><div id="chRes"></div>`);
  const f=$('#fCh');
  f.chave.focus();
  f.onsubmit=e=>{ e.preventDefault(); acao(e.submitter, async()=>{ mostrarChave(await api('ges.chave.buscar',{chave:f.chave.value})); }); };
  if(chaveIni) f.requestSubmit();
}
function mostrarChave(r){
  const ch=r.chave.replace(/(\d{4})/g,'$1 ').trim();
  const cliEmit=r.emitenteCliente;
  const jaTem=r.lancamentos.length||r.documentos.length;
  $('#chRes').innerHTML = `
    ${r.valida?'':'<div class="caixa-erro"><b>O dígito verificador não confere.</b> Confira se a chave foi digitada corretamente.</div>'}
    <div class="tabela" style="margin-top:12px"><table><tbody>
      <tr><td class="pequeno" style="width:34%">Documento</td><td><b>${esc(r.tipo)}</b> ${r.valida?'<span class="chip ok">chave válida</span>':''}</td></tr>
      <tr><td class="pequeno">Número${r.serie?' / série':''}</td><td>${esc(r.numero)}${r.serie?' / '+esc(r.serie):''}</td></tr>
      <tr><td class="pequeno">Emissão</td><td>${esc(r.mes)}/${esc(r.ano)}${r.uf?' · '+esc(r.uf):''}</td></tr>
      <tr><td class="pequeno">Emitente</td><td>${cpfFmt(r.emitente)}${cliEmit?` <span class="chip neu">cliente: ${esc(cliEmit.nome)}</span>`:''}</td></tr>
      <tr><td class="pequeno">Chave</td><td class="pequeno" style="font-variant-numeric:tabular-nums">${ch}</td></tr>
    </tbody></table></div>
    ${jaTem?`<div class="caixa-aviso"><b>Esta nota já está no sistema.</b>
      ${r.lancamentos.map(l=>`<br>Lançamento de ${esc(l.cliente)}: ${dataBR(l.data)} · ${esc(l.historico)} · ${brl(l.valor)} <button class="btn sec peq" type="button" data-irl="${l.clienteId}|${l.id}">Ver</button>`).join('')}
      ${r.documentos.map(d=>`<br>Arquivo de ${esc(d.cliente)}: <a href="${esc(d.driveUrl)}" target="_blank" rel="noopener">${esc(d.nomeArquivo)}</a>`).join('')}</div>`:''}
    <p class="pequeno" style="margin:10px 0 4px">A chave identifica a nota, mas não traz valor, data exata nem produtos. Para importar tudo automaticamente, anexe o XML; ou lance com os dados acima e complete data e valor.</p>
    <div class="form" style="margin-top:6px">
      <label class="campo">Cliente${selClienteSimples('chCli', cliEmit?cliEmit.id:G.cli)}</label>
      <label class="campo">Esta nota é<select id="chTipo"><option value="2" ${cliEmit?'':'selected'}>Compra / despesa do cliente</option><option value="1" ${cliEmit?'selected':''}>Venda / receita do cliente</option></select></label>
    </div>
    <div class="acoes">
      <button class="btn" type="button" id="chXml">Anexar o XML desta nota</button>
      <button class="btn sec" type="button" id="chLanc">Lançar com estes dados</button>
      <a class="btn sec" href="${esc(r.consulta)}" target="_blank" rel="noopener">Consultar na ${r.modelo==='NFSE'?'NFS-e Nacional':'SEFAZ'} ↗</a>
      <button class="btn sec" type="button" id="chCop">Copiar chave</button>
    </div>
    <ul class="lista-msg" id="chFila"></ul>`;
  document.querySelectorAll('[data-irl]').forEach(b=>b.onclick=()=>{ const [c,id]=b.dataset.irl.split('|'); $('#dlg').close(); G.cli=c; G.destacar=[id]; G.periodo={ini:'2000-01-01',fim:'2099-12-31'}; abrir('lanc'); });
  $('#chCop').onclick=async()=>{ try{ await navigator.clipboard.writeText(r.chave); toast('Chave copiada. Cole na consulta.'); }catch(e){ toast('Não foi possível copiar.',true); } };
  $('#chLanc').onclick=()=>{ const cid=$('#chCli').value; if(!cid){ toast('Escolha o cliente.',true); return; } G.cli=cid; const venda=$('#chTipo').value==='1';
    editarLanc({ tipoLanc:venda?'1':'2', tipoDoc:'1', numDoc:r.numero, chave:r.chave, idPartic:venda?'':r.emitente,
      historico:(venda?'Venda':'Compra')+' cf. '+r.tipo+' '+r.numero, origemChave:r.chave, data:'' }); };
  $('#chXml').onclick=async()=>{ const cid=$('#chCli').value; if(!cid){ toast('Escolha o cliente.',true); return; }
    const f=await escolherArquivo('.xml,.pdf'); if(!f) return;
    const li=document.createElement('li'); li.textContent=f.name+' — enviando…'; $('#chFila').prepend(li);
    try{ const res=await api('ges.enviar',{clienteId:cid, arquivo:{nome:f.name, mime:f.type||mimeDe(f.name), base64:await lerB64(f)}, obs:'Nota buscada pela chave '+r.chave});
      li.innerHTML = esc(f.name)+' — '+(res.duplicado?esc(res.mensagem):(STATUS_DOC[res.documento.status]||[0,res.documento.status])[1]+' · '+res.lancamentos.map(l=>`${dataBR(l.data)} ${l.entrada?brl(l.entrada):'− '+brl(l.saida)}`).join(', ')+((res.erros||[]).length?' · '+res.erros.map(esc).join(' '):''));
    }catch(e){ li.textContent=f.name+' — erro: '+e.message; } };
}
function selClienteSimples(id, sel){ return `<select id="${id}"><option value="">Escolha…</option>${G.clientes.filter(c=>c.ativo==='SIM').map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.nome)} — ${cpfFmt(c.cpf)}</option>`).join('')}</select>`; }

TOKEN ? iniciar() : telaLogin();
function envioPendente(){ try{ const u=JSON.parse(localStorage.getItem('lcr_upl')||'null'); if(u && Date.now()-u.em<6*60000) return u; }catch(e){} return null; }
function marcarEnvio(u){ try{ u? localStorage.setItem('lcr_upl', JSON.stringify(Object.assign({em:Date.now()},u))) : localStorage.removeItem('lcr_upl'); }catch(e){} }
</script>
